# ── prefix: Ctrl+b는 readline의 backward-char와 충돌 ──
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# ── 기본 동작 ──
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g repeat-time 1000
set -g focus-events on

# 창 이름은 훅(agent-window-label)이 소유한다.
# 이 줄이 없으면 tmux 가 실행 중인 프로세스 이름으로 계속 덮어쓴다.
setw -g automatic-rename off

# ── 클립보드: OSC 52로 원격→로컬 전달 ──
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── prefix 사용 (분할·생성 시 현재 디렉터리 유지) ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ── prefix 없이 바로 (-n): Claude/Codex TUI 안에서도 확실히 동작 ──
bind -n M-d detach-client
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-w confirm-before -p "close window? (y/n)" kill-window
bind -n M-x kill-pane
bind -n M-z resize-pane -Z
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-r source-file ~/.tmux.conf \; display "reloaded"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── 상태줄: 어느 agent가 출력을 냈는지 표시 ──
setw -g monitor-activity on
set -g visual-activity off
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour250"
set -g status-left "#[bg=colour39,fg=colour232,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour250]%H:%M "
set -g status-right-length 20
# 창 이름은 최대 24자까지 늘어나는데(agent/label-of.sh) 상태줄은 그만큼 없다.
# 폭 76 기준 계산: 세션명 5 + 시계 7 을 빼면 창 목록에 64칸.  이모지+마커가 창당
# 4칸을 먼저 먹으므로 6창이면 글자에 쓸 수 있는 건 창당 서너 자뿐이다.
#
# 그래서 비활성 창은 잘라서 보여준다.  tmux 의 #{=N:...} 은 **표시 폭** 기준이라
# 이모지 하나를 2로 센다 — =7 은 "이모지 2개(4칸) + 글자 3자" 가 된다.
# 창 이름 자체는 안 건드린다.  ccname 도 훅도 전체 이름을 그대로 쓴다.
#   비활성 =7    어느 도구가 무슨 상태인지만 보이면 된다 (⏳🟠cli…)
#   활성  =18    지금 있는 창은 이름을 알아야 한다
# 콜론을 뺀 것도 창당 1칸씩 벌기 위해서다.  실측 6창 70/76.
setw -g window-status-format " #I#{=7:window_name} "
setw -g window-status-current-format "#[bg=colour39,fg=colour232,bold] #I#{=18:window_name} "
setw -g window-status-activity-style "fg=colour214,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
