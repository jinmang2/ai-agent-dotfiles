# 에이전트 프로필 → tmux 창 번호 배경색
#   형식: <AGENT_PROFILE 값>  <tmux 색>
#   프로필 = 도구 + 계정.  어느 도구가 그 창을 쓰고 있는지 상태줄의 창 번호
#   배경색으로 구분한다 (예전엔 이모지 마커였는데, 창당 2칸을 먹어서 색으로 바꿈).
#   색을 '-' 로 두면 그 프로필만 번호에 색을 입히지 않습니다.
#
#   색은 tmux 256색 이름: colour0~255.  대비 확인은 다음으로:
#     for i in 33 135 208 41 178 160; do printf '\e[48;5;%sm\e[38;5;235m %s \e[0m ' $i $i; done; echo
#
#   쓰려면 셸에서 AGENT_PROFILE 을 export 합니다. Claude Code 는 claude-<계정>
#   실행 함수가 자동으로 넣어줍니다 (shell/agents.sh).
#
claude        colour33
claude-team   colour135
codex         colour208
gemini        colour41
copilot       colour178
antigravity   colour160
