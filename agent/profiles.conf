# 에이전트 프로필 → tmux 창 이름 마커
#   형식: <AGENT_PROFILE 값>  <마커>
#   프로필 = 도구 + 계정.  어느 도구가 그 창을 쓰고 있는지 한 눈에 구분하기 위한 표.
#   마커를 '-' 로 두면 그 프로필만 마커 없이 표시됩니다.
#
#   쓸 만한 마커: 🔵 🟣 🟢 🟡 🔴 🟠 🟤 ⚫ ⚪  /  ᴬ ᴮ ᶜ ᴰ ᴱ ᵀ ᴷ ᴹ ᴾ ᴿ
#
#   쓰려면 셸에서 AGENT_PROFILE 을 export 합니다. Claude Code 는 claude-<계정>
#   실행 함수가 자동으로 넣어줍니다 (shell/agents.sh).
#
claude        🔵
claude-team   🟣
codex         🟠
